services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proxius
      POSTGRES_PASSWORD: proxius
      POSTGRES_DB: proxius
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxius"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://proxius:proxius@db:5432/proxius
      BIND: 0.0.0.0:8080
      PROXIUS_ADMIN_DIR: /app/admin
      RUST_LOG: info
    ports:
      - "8080:8080"

volumes:
  pgdata:
