[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine",
    "crates/grpc",
    "crates/runner",
    "crates/cli",
    "crates/db",
    "crates/server",
    "apps/desktop/src-tauri",
]
# Crate berikut menyusul sesuai milestone: agent, collab, script.

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Proxius"]
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "deflate", "cookies", "multipart", "rustls-tls", "http2"] }
ts-rs = "10"
uuid = { version = "1", features = ["v7", "serde", "js"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
protox-parse = "0.7"
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost", "tls", "tls-roots"] }
futures = "0.3"

[profile.dev]
# Build lebih cepat saat pengembangan
opt-level = 0
