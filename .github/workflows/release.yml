name: Release

# Build the desktop app for Windows, macOS and Linux and attach the installers
# to a GitHub Release. Triggered by pushing a version tag (e.g. v0.0.1).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest        # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Proxius ${{ github.ref_name }}"
          releaseBody: |
            Proxius desktop app — download the installer for your platform below.

            - **Windows**: `.msi` or the NSIS `-setup.exe`
            - **macOS**: `.dmg` (Apple Silicon and Intel builds)
            - **Linux**: `.AppImage` or `.deb`

            The builds are unsigned; on first launch you may need to allow the app
            past your OS's SmartScreen / Gatekeeper prompt.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
